# Coolify Compose resource for dashwood.net.
# Coolify must NOT docker build this. GitHub Actions publishes the image;
# this file only names it. See the coolify-docker-deploys skill.

services:
  site:
    image: ${DASHWOOD_IMAGE:?Set ghcr.io/dashw00d/dashwood:sha-* in Coolify}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CONTACT_TO: ${CONTACT_TO:-ryan@dashwood.net}
      CONTACT_FROM: ${CONTACT_FROM:-}
      CONTACT_BCC: ${CONTACT_BCC:-}
    mem_limit: 64m
    cpus: "0.15"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 3s
      retries: 3
