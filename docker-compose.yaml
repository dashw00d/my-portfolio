# Coolify Compose resource for dashwood.net
# Static HTML + one tiny Node process for /api/contact.

services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CONTACT_TO: ${CONTACT_TO:-ryan@dashwood.net}
      CONTACT_FROM: ${CONTACT_FROM:-}
      CONTACT_BCC: ${CONTACT_BCC:-}
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 64M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 3s
      retries: 3
