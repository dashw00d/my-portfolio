# Coolify uses the Dockerfile build pack. This compose is for local runs
# and documents the runtime shape. Builds happen on ae-coolify-01 with
# Docker layer cache — not GitHub Actions.

services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CONTACT_TO: ${CONTACT_TO:-ryan@dashwood.net}
      CONTACT_FROM: ${CONTACT_FROM:-}
      CONTACT_BCC: ${CONTACT_BCC:-}
    mem_limit: 64m
    cpus: "0.15"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 3s
      retries: 3
